<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Horarios - SISGA</title>
    <style>
        table { border-collapse: collapse; width: 90%; margin: 20px auto; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: middle; }
        th { background-color: #1565C0; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .btn { padding: 5px 10px; text-decoration: none; color: white; border-radius: 4px; display: inline-block; }
        .btn-primary { background-color: #1565C0; }
        .btn-danger { background-color: #dc3545; }
        .acciones { display: flex; gap: 5px; justify-content: center; }
        th:last-child { width: 160px; }
    </style>
</head>
<body>
<h1 style="text-align:center;">Listado de Horarios</h1>
<div style="text-align:center; margin-bottom: 20px;">
    <a th:href="@{/horarios/nuevo}" class="btn btn-primary">Registrar Nuevo Horario</a>
</div>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>ID Asignatura</th>
        <th>Día</th>
        <th>Hora Inicio</th>
        <th>Hora Fin</th>
        <th>Aula</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="hor : ${listaHorarios}">
        <td th:text="${hor.idHorario}"></td>
        <td th:text="${hor.idAsignatura}"></td>
        <td th:text="${hor.diaSemana}"></td>
        <td th:text="${hor.horaInicio}"></td>
        <td th:text="${hor.horaFin}"></td>
        <td th:text="${hor.aula}"></td>
        <td>
            <div class="acciones">
                <a th:href="@{/horarios/editar/{id}(id=${hor.idHorario})}" class="btn btn-primary">Editar</a>
                <a th:href="@{/horarios/eliminar/{id}(id=${hor.idHorario})}" class="btn btn-danger" onclick="return confirm('¿Eliminar horario?');">Eliminar</a>
            </div>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(listaHorarios)}">
        <td colspan="7" style="text-align:center;">No hay horarios registrados.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
