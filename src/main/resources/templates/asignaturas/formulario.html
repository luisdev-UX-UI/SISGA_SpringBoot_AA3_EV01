<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asignatura - SISGA</title>
</head>
<body>
<h1 style="text-align:center;">Registrar Asignatura</h1>
<form th:action="@{/asignaturas/guardar}" th:object="${asignaturaDTO}" method="post" style="max-width: 400px; margin: 0 auto;">
  <label>ID Docente:</label>
  <input type="number" th:field="*{idDocente}" required><br><br>
  <label>Código Asignatura:</label>
  <input type="text" th:field="*{codigoAsignatura}" required><br><br>
  <label>Nombre:</label>
  <input type="text" th:field="*{nombre}" required><br><br>
  <label>Créditos:</label>
  <input type="number" th:field="*{creditos}" value="3"><br><br>
  <label>Descripción:</label>
  <textarea th:field="*{descripcion}" rows="3" cols="30"></textarea><br><br>
  <button type="submit">Guardar Asignatura</button>
</form>
<div style="text-align:center; margin-top: 20px;">
  <a th:href="@{/asignaturas}">Volver a la lista</a>
</div>
</body>
</html>
